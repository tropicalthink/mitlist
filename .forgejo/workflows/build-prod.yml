# Build production images and push them to the project's own container
# registry (Forgejo packages). Runs on the self-hosted Forgejo runner only;
# GitHub ignores .forgejo/workflows.
#
# Notes on the shape of this file:
#   - runs-on: dind — the runner has no `ubuntu-latest`. The `dind` label maps
#     to docker:28-cli. `docker` maps to node:22, which has no docker CLI.
#   - DOCKER_HOST is the default gateway. Job containers are created by the
#     dind daemon, so they cannot resolve the compose service name.
#   - Registry auth uses REGISTRY_USER/REGISTRY_TOKEN, org-level secrets for
#     the ci-publisher account. The auto-injected token logs in successfully
#     and then fails the push with "unauthorized: reqPackageAccess".
#   - No docker/setup-buildx-action: third-party actions resolve through
#     Forgejo's proxy and fail confusingly when they are not mirrored.
#   - Images are tagged with the commit SHA. That is what the deployment
#     pins via MITLIST_TAG, and it makes rollback a tag change.
#   - Pushes go to REGISTRY_PUSH_HOST (a secret: the registry's private
#     host:port), not to the public hostname. The public name sits behind
#     Cloudflare, and a Docker blob is uploaded in ONE request, so any layer
#     over Cloudflare's 100MB body limit dies with a 413 — which is what the
#     PWA image did. Forgejo keys packages by /v2/<owner>/<image> rather than
#     by the hostname the client used, so the public pull URL is unchanged.
#     The runner's dind must trust that host as an insecure registry.
#
# Every `test -n` gate below is deliberate: the official image must never
# fall back to an unattested guest endpoint.
#
# The web build carries no Firebase or App Check values. App Check's only web
# provider is reCAPTCHA Enterprise, which needs GCP billing to protect exactly
# one endpoint, so web attests with Cloudflare Turnstile and mobile keeps App
# Check. The API accepts either.
name: build-prod

on:
  push:
    branches: [prod]
  workflow_dispatch:

env:
  # The public image name the deployment pulls by, and the only one that
  # belongs in a MITLIST_TAG instruction. The push path is resolved per job
  # from the REGISTRY_PUSH_HOST secret.
  IMAGE_PREFIX: git.tropicalthink.com/tropicalthink/mitlist

jobs:
  build:
    runs-on: dind
    steps:
      # Not actions/checkout@v4: that is a Node action, and the `dind` label
      # maps to docker:28-cli, which ships git but no node. Fetching the exact
      # SHA by hand also drops the dependency on Forgejo's action proxy and is
      # reproducible in a way that cloning a branch is not.
      - name: checkout
        run: |
          set -eu
          git init -q .
          git remote add origin \
            "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@git.tropicalthink.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Point at the dind daemon
        run: |
          set -eu
          echo "DOCKER_HOST=tcp://$(ip route | awk '/default/{print $3}'):2375" >> "$GITHUB_ENV"

      - name: Resolve the registry push host
        env:
          REGISTRY_PUSH_HOST: ${{ secrets.REGISTRY_PUSH_HOST }}
        run: |
          set -eu
          # Fail closed: without the private push host the build would push to
          # nothing, or worse, to the tunnelled public name and 413.
          test -n "$REGISTRY_PUSH_HOST"
          echo "REGISTRY=$REGISTRY_PUSH_HOST" >> "$GITHUB_ENV"
          echo "PUSH_PREFIX=$REGISTRY_PUSH_HOST/${{ github.repository }}" >> "$GITHUB_ENV"

      - name: Log in to the registry
        run: |
          set -eu
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build and push the API
        run: |
          set -eu
          docker build \
            --build-arg VERSION="${{ github.sha }}" \
            -f backend/Dockerfile.prod \
            -t "$PUSH_PREFIX-backend:${{ github.sha }}" \
            backend
          docker push "$PUSH_PREFIX-backend:${{ github.sha }}"

      - name: Build and push the PWA
        env:
          API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN_WEB }}
          REQTRACK_APP_KEY: ${{ secrets.REQTRACK_APP_KEY }}
          REQTRACK_URL: ${{ secrets.REQTRACK_URL }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          ANDROID_APP_LINK_SHA256: ${{ secrets.ANDROID_APP_LINK_SHA256 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          # Fail closed on everything the official build must not ship without.
          # No Firebase or App Check values here: App Check is mobile-only (see
          # AppCheckConfig), and the web build attests with Turnstile, so a
          # missing site key is the thing worth stopping for.
          test -n "$API_BASE_URL"
          test -n "$APPLE_TEAM_ID"
          test -n "$TURNSTILE_SITE_KEY"

          sed -i "s/__APPLE_TEAM_ID__/$APPLE_TEAM_ID/g" \
            frontend/web/.well-known/apple-app-site-association

          # Android is deliberately conditional. The fingerprint is the Play
          # app-signing certificate, which does not exist until the first AAB
          # upload — and that upload is manual. Publishing the placeholder is
          # publishing a false statement, so serve no file rather than a wrong
          # one; the check below then still catches every other placeholder.
          # Comma-separated fingerprints become a JSON array entry each, so
          # the Play app-signing key and the upload key used for sideloaded
          # builds can both be trusted.
          if [ -n "$ANDROID_APP_LINK_SHA256" ]; then
            fingerprints=$(printf '%s' "$ANDROID_APP_LINK_SHA256" | tr -d ' ' | sed 's/,/","/g')
            sed -i "s/__PLAY_APP_SIGNING_SHA256__/$fingerprints/g" \
              frontend/web/.well-known/assetlinks.json
          else
            echo "no ANDROID_APP_LINK_SHA256: dropping assetlinks.json" >&2
            rm -f frontend/web/.well-known/assetlinks.json
          fi

          if grep -R '__[A-Z0-9_]*__' frontend/web/.well-known; then
            echo "Unresolved app-link association placeholder" >&2
            exit 1
          fi

          DOCKER_BUILDKIT=1 docker build \
            --build-arg API_BASE_URL="$API_BASE_URL" \
            --build-arg GLITCHTIP_DSN="$GLITCHTIP_DSN" \
            --build-arg ENVIRONMENT=production \
            --build-arg REQTRACK_APP_KEY="$REQTRACK_APP_KEY" \
            --build-arg REQTRACK_URL="$REQTRACK_URL" \
            --build-arg TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" \
            -f frontend/Dockerfile.prod \
            -t "$PUSH_PREFIX-frontend:${{ github.sha }}" \
            frontend
          docker push "$PUSH_PREFIX-frontend:${{ github.sha }}"

      - name: Tell us what to pin
        run: |
          # Several app nodes serve the API behind one tunnel. Pinning only
          # one leaves the others on the old image and requests alternate
          # between versions — pin ALL of them, in the same sitting.
          echo "Deploy by setting MITLIST_TAG=${{ github.sha }} on EVERY app node"
          echo "(image name: $IMAGE_PREFIX-backend / $IMAGE_PREFIX-frontend);"
          echo "verify all nodes report the same image tag afterwards."

      - name: Log out
        if: always()
        run: docker logout "$REGISTRY" || true
