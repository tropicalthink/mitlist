# CI: run tests + static analysis on every pull request.
# Generated files are committed; CI checks codegen freshness.
name: CI

on:
  pull_request:
  push:
    branches:
      - new-main-fr

jobs:
  # Forgejo has no built-in secret scanning, so this job is the equivalent of
  # GitHub's: it scans the FULL history of the pushed ref with gitleaks and
  # fails the run if a credential is found. Allowlisted false positives live
  # in .gitleaks.toml. The binary is pinned by version and checksum.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan every commit for leaked credentials
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -eu
          curl -sSL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mitlist
          POSTGRES_PASSWORD: mitlist
          POSTGRES_DB: mitlist_test
        options: >-
          --health-cmd "pg_isready -U mitlist"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # `postgres`, not `localhost`: jobs run inside a container and the runner
      # attaches services to the job network under their service key. A `ports:`
      # mapping would publish on the runner host, which the job cannot reach —
      # and would collide when two runs overlap.
      TEST_DATABASE_URL: postgres://mitlist:mitlist@postgres:5432/mitlist_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'   # match backend/go.mod
      # cwebp backs the image-recompression tests (they skip without it), the
      # same binary Dockerfile.prod installs for the running API.
      - name: Install cwebp
        # No sudo assumption: the runner may execute jobs as root in a container.
        run: |
          if command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
          $SUDO apt-get update -qq && $SUDO apt-get install -y -qq webp
      - name: Build
        run: cd backend && go build ./...
      - name: Vet
        run: cd backend && go vet ./...
      - name: Format check
        run: |
          cd backend
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needs:"; echo "$unformatted"; exit 1; fi
      - name: Test
        run: cd backend && go test ./...

  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: cd landing && npm ci
      - name: Build
        run: cd landing && npm run build

  intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import smoke
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'intelligence')
          import ml.build_app_seed
          import ml.build_store_aisles
          import ml.check_classifier_parity
          import ml.eval.resolution_eval
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Full URL, not the bare `subosito/flutter-action@v2`: the runner resolves
      # bare refs against data.forgejo.org, which only mirrors the `actions/*`
      # namespace, so a third-party action 404s at clone time.
      - uses: https://github.com/subosito/flutter-action@v2
        with:
          # Pinned, not bare `channel: stable`: an unpinned SDK re-resolved 15
          # dependencies against the committed pubspec.lock, so codegen and
          # tests would run on different package versions than we develop on.
          flutter-version: '3.44.0'
          channel: stable
      - name: Pub get
        run: cd frontend && flutter pub get
      - name: Format check
        run: cd frontend && dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: cd frontend && dart analyze
      - name: Codegen up to date
        run: |
          cd frontend
          dart run build_runner build
          git diff --exit-code -- lib
      - name: Classifier/seed parity
        run: python3 intelligence/ml/check_classifier_parity.py
      - name: Test
        run: cd frontend && flutter test
      - name: Resolution eval (report-only)
        run: |
          cd frontend && EXPORT_RESOLUTION_FEATURES=1 flutter test test/services/resolution_feature_export_test.dart
          python3 ../intelligence/ml/eval/resolution_eval.py
