version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.25
        RUN go install github.com/air-verse/air@latest
        WORKDIR /app
        CMD ["air", "-c", ".air.toml"]
    container_name: mitlist-app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
    environment:
      # Required defaults for local development.
      # Override by creating a .env file from .env.example.
      DATABASE_URL: postgres://mitlist:mitlist@db:5432/mitlist?sslmode=disable
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ""
      SECRET_KEY: dev-secret-key-min-32-chars-long-12345
      SESSION_SECRET_KEY: dev-session-secret-key-min-32-chars-12345
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:5173
      API_PREFIX: /api
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      RUN_MIGRATIONS_ON_STARTUP: "true"
      WARM_CACHE_ON_STARTUP: "false"
      LOG_LEVEL: DEBUG
      GEMINI_API_KEY: ""
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: mitlist-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mitlist
      POSTGRES_PASSWORD: mitlist
      POSTGRES_DB: mitlist
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitlist -d mitlist"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mitlist-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  go-mod-cache:
