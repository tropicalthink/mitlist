name: Build closed-beta mobile artifacts

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Materialize protected Android configuration
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          test -n "$GOOGLE_SERVICES_JSON_B64"
          test -n "$ANDROID_KEYSTORE_B64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > frontend/android/app/google-services.json
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > frontend/android/app/release.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=release.jks\n'
          } > frontend/android/key.properties
      - name: Build signed Android App Bundle
        run: cd frontend && flutter pub get && flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: mitlist-android-beta
          path: frontend/build/app/outputs/bundle/release/app-release.aab

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_B64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      - name: Materialize protected iOS configuration
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
          IOS_PROVISIONING_PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_B64 }}
          IOS_EXPORT_OPTIONS_PLIST_B64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_B64 }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
        run: |
          set -eu
          test -n "$GOOGLE_SERVICE_INFO_PLIST_B64"
          test -n "$IOS_PROVISIONING_PROFILE_B64"
          test -n "$IOS_EXPORT_OPTIONS_PLIST_B64"
          test -n "$IOS_DEVELOPMENT_TEAM"
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 -d > frontend/ios/Runner/GoogleService-Info.plist
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$IOS_PROVISIONING_PROFILE_B64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/mitlist.mobileprovision"
          printf '%s' "$IOS_EXPORT_OPTIONS_PLIST_B64" | base64 -d > frontend/ios/ExportOptions.plist
          printf '\nDEVELOPMENT_TEAM=%s\nCODE_SIGN_IDENTITY=Apple Distribution\n' "$IOS_DEVELOPMENT_TEAM" >> frontend/ios/Flutter/Release.xcconfig
      - name: Build iOS archive
        run: cd frontend && flutter pub get && flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
      - uses: actions/upload-artifact@v4
        with:
          name: mitlist-ios-beta
          path: frontend/build/ios/ipa/*.ipa
