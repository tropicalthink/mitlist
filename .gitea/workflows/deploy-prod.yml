# Production deploy: build and push Flutter web + Go API images.
# Merge a PR into `prod` to run. Requires secrets: ME_USERNAME, ME_PASSWORD.
# Required for the official image: PRODUCTION_API_BASE_URL,
# ANDROID_APP_LINK_SHA256, APPLE_TEAM_ID, and the Firebase App Check/web
# settings below. Optional build defines include GLITCHTIP_DSN_WEB,
# REQTRACK_APP_KEY, and REQTRACK_URL.
# PRODUCTION_FIREBASE_PROJECT_ID, PRODUCTION_FIREBASE_API_KEY,
# PRODUCTION_FIREBASE_APP_ID, PRODUCTION_FIREBASE_MESSAGING_SENDER_ID,
# PRODUCTION_FIREBASE_PROJECT_NUMBER,
# PRODUCTION_FIREBASE_APP_CHECK_REQUIRED (must be `true`),
# PRODUCTION_APP_CHECK_WEB_RECAPTCHA_SITE_KEY,
# REQTRACK_APP_KEY (reqtrack intake key; enables the in-app
# "Send feedback" card), REQTRACK_URL (override tracker host).
name: Deploy to production (Gitea registry)

on:
  pull_request:
    types: [closed]
    branches:
      - prod

jobs:
  build_and_push_pwa:
    if: gitea.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set repository variables
        id: vars
        run: |
          ACTOR="${{ gitea.actor || gitea.event.repository.owner.login }}"
          REPO_NAME="${{ gitea.repository_name || gitea.event.repository.name }}"

          echo "actor=$ACTOR" >> $GITHUB_OUTPUT
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT

          echo "--- Determined Variables ---"
          echo "Actor: $ACTOR"
          echo "Repo Name: $REPO_NAME"
          echo "--------------------------"

      - name: Set image version
        id: version
        run: |
          VERSION="$(date +'%Y-%m-%d')-$(echo ${{ gitea.sha }} | cut -c1-7)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Image Version: $VERSION"

      - name: Login to Gitea Registry
        run: |
          echo "${{ secrets.ME_PASSWORD }}" | docker login git.vinylnostalgia.com -u "${{ secrets.ME_USERNAME }}" --password-stdin

      - name: Build PWA image (Flutter web)
        env:
          API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL }}
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN_WEB }}
          REQTRACK_APP_KEY: ${{ secrets.REQTRACK_APP_KEY }}
          REQTRACK_URL: ${{ secrets.REQTRACK_URL }}
          ANDROID_APP_LINK_SHA256: ${{ secrets.ANDROID_APP_LINK_SHA256 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_CHECK_ENABLED: "true"
          FIREBASE_PROJECT_ID: ${{ secrets.PRODUCTION_FIREBASE_PROJECT_ID }}
          FIREBASE_PROJECT_NUMBER: ${{ secrets.PRODUCTION_FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_CHECK_REQUIRED: ${{ secrets.PRODUCTION_FIREBASE_APP_CHECK_REQUIRED }}
          FIREBASE_API_KEY: ${{ secrets.PRODUCTION_FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.PRODUCTION_FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PRODUCTION_FIREBASE_MESSAGING_SENDER_ID }}
          APP_CHECK_WEB_RECAPTCHA_SITE_KEY: ${{ secrets.PRODUCTION_APP_CHECK_WEB_RECAPTCHA_SITE_KEY }}
        run: |
          set -eu
          test -n "$API_BASE_URL"
          test -n "$ANDROID_APP_LINK_SHA256"
          test -n "$APPLE_TEAM_ID"
          # The official image is never allowed to fall back to an
          # unauthenticated App Check provider. Self-hosted images use the
          # disabled default and can opt in independently at runtime.
          test "$APP_CHECK_ENABLED" = "true"
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$FIREBASE_PROJECT_NUMBER"
          test "$FIREBASE_APP_CHECK_REQUIRED" = "true"
          test -n "$FIREBASE_API_KEY"
          test -n "$FIREBASE_APP_ID"
          test -n "$FIREBASE_MESSAGING_SENDER_ID"
          test -n "$APP_CHECK_WEB_RECAPTCHA_SITE_KEY"
          case "$FIREBASE_PROJECT_ID" in
            ''|*[!a-z0-9-]*) echo "PRODUCTION_FIREBASE_PROJECT_ID contains invalid characters" >&2; exit 1 ;;
          esac
          case "$FIREBASE_PROJECT_NUMBER" in
            ''|*[!0-9]*) echo "PRODUCTION_FIREBASE_PROJECT_NUMBER must be numeric" >&2; exit 1 ;;
          esac
          sed -i "s/__PLAY_APP_SIGNING_SHA256__/$ANDROID_APP_LINK_SHA256/g" frontend/web/.well-known/assetlinks.json
          sed -i "s/__APPLE_TEAM_ID__/$APPLE_TEAM_ID/g" frontend/web/.well-known/apple-app-site-association
          if grep -R '__[A-Z0-9_]*__' frontend/web/.well-known; then
            echo "Unresolved app-link association placeholder"
            exit 1
          fi
          ACTOR="${{ steps.vars.outputs.actor }}"
          REPO_NAME="${{ steps.vars.outputs.repo_name }}"
          VERSION="${{ steps.version.outputs.version }}"

          echo "Building PWA image: git.vinylnostalgia.com/$ACTOR/$REPO_NAME-frontend:$VERSION"

          DOCKER_BUILDKIT=1 docker build \
            --compress \
            --no-cache \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg API_BASE_URL="${API_BASE_URL}" \
            --build-arg GLITCHTIP_DSN="${GLITCHTIP_DSN}" \
            --build-arg REQTRACK_APP_KEY="${REQTRACK_APP_KEY}" \
            --build-arg REQTRACK_URL="${REQTRACK_URL}" \
            --build-arg APP_CHECK_ENABLED="${APP_CHECK_ENABLED}" \
            --build-arg FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID}" \
            --build-arg FIREBASE_API_KEY="${FIREBASE_API_KEY}" \
            --build-arg FIREBASE_APP_ID="${FIREBASE_APP_ID}" \
            --build-arg FIREBASE_MESSAGING_SENDER_ID="${FIREBASE_MESSAGING_SENDER_ID}" \
            --build-arg APP_CHECK_WEB_RECAPTCHA_SITE_KEY="${APP_CHECK_WEB_RECAPTCHA_SITE_KEY}" \
            --build-arg ENVIRONMENT="production" \
            -t "git.vinylnostalgia.com/$ACTOR/$REPO_NAME-frontend:latest" \
            -t "git.vinylnostalgia.com/$ACTOR/$REPO_NAME-frontend:$VERSION" \
            ./frontend -f ./frontend/Dockerfile.prod

          echo "PWA image built successfully"

      - name: Build backend image (Go API)
        run: |
          ACTOR="${{ steps.vars.outputs.actor }}"
          REPO_NAME="${{ steps.vars.outputs.repo_name }}"
          VERSION="${{ steps.version.outputs.version }}"

          echo "Building backend image: git.vinylnostalgia.com/$ACTOR/$REPO_NAME-backend:$VERSION"

          DOCKER_BUILDKIT=1 docker build \
            --compress \
            --no-cache \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg VERSION="$VERSION" \
            -t "git.vinylnostalgia.com/$ACTOR/$REPO_NAME-backend:latest" \
            -t "git.vinylnostalgia.com/$ACTOR/$REPO_NAME-backend:$VERSION" \
            ./backend -f ./backend/Dockerfile.prod

          echo "Backend image built successfully"

      - name: Push PWA image with retry logic
        run: |
          ACTOR="${{ steps.vars.outputs.actor }}"
          REPO_NAME="${{ steps.vars.outputs.repo_name }}"
          VERSION="${{ steps.version.outputs.version }}"

          IMAGE_LATEST="git.vinylnostalgia.com/$ACTOR/$REPO_NAME-frontend:latest"
          IMAGE_VERSIONED="git.vinylnostalgia.com/$ACTOR/$REPO_NAME-frontend:$VERSION"

          max_retries=5
          retry_count=0
          base_wait=10
          while [ $retry_count -lt $max_retries ]; do
            echo "Pushing PWA images (attempt $((retry_count + 1)) of $max_retries)..."
            if docker push "$IMAGE_LATEST" && docker push "$IMAGE_VERSIONED"; then
              echo "PWA images pushed successfully"
              break
            fi
            retry_count=$((retry_count + 1))
            if [ $retry_count -lt $max_retries ]; then
              wait_time=$((base_wait * retry_count))
              echo "Push failed, retrying in $wait_time seconds..."
              sleep $wait_time
            fi
          done
          if [ $retry_count -eq $max_retries ]; then
            echo "Failed to push PWA images after $max_retries attempts"
            exit 1
          fi

      - name: Push backend image with retry logic
        run: |
          ACTOR="${{ steps.vars.outputs.actor }}"
          REPO_NAME="${{ steps.vars.outputs.repo_name }}"
          VERSION="${{ steps.version.outputs.version }}"

          IMAGE_LATEST="git.vinylnostalgia.com/$ACTOR/$REPO_NAME-backend:latest"
          IMAGE_VERSIONED="git.vinylnostalgia.com/$ACTOR/$REPO_NAME-backend:$VERSION"

          max_retries=5
          retry_count=0
          base_wait=10
          while [ $retry_count -lt $max_retries ]; do
            echo "Pushing backend images (attempt $((retry_count + 1)) of $max_retries)..."
            if docker push "$IMAGE_LATEST" && docker push "$IMAGE_VERSIONED"; then
              echo "Backend images pushed successfully"
              break
            fi
            retry_count=$((retry_count + 1))
            if [ $retry_count -lt $max_retries ]; then
              wait_time=$((base_wait * retry_count))
              echo "Push failed, retrying in $wait_time seconds..."
              sleep $wait_time
            fi
          done
          if [ $retry_count -eq $max_retries ]; then
            echo "Failed to push backend images after $max_retries attempts"
            exit 1
          fi

      - name: Cleanup Docker resources
        if: always()
        run: |
          echo "Cleaning up Docker resources..."
          docker system prune -af --volumes
          docker logout git.vinylnostalgia.com
          echo "Cleanup completed"

      - name: Show final image sizes
        if: always()
        run: |
          echo "Final image sizes:"
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | grep -E "(vinylnostalgia|REPOSITORY)" || true
