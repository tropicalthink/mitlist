# Gitea Actions — integration tests, Go race build, and Flutter web release build.
name: Build and Test

on:
  push:
    branches:
      - main
      - develop
      - new-main-fr
  pull_request:
    branches:
      - main
      - develop
      - new-main-fr

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mitlist
          POSTGRES_PASSWORD: mitlist
          POSTGRES_DB: mitlist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Go mod download
        working-directory: backend
        run: go mod download

      - name: Go vet
        working-directory: backend
        run: go vet ./...

      - name: Go test (race)
        working-directory: backend
        env:
          DATABASE_URL: postgres://mitlist:mitlist@localhost:5432/mitlist_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-at-least-32-characters-long
          SESSION_SECRET_KEY: test-session-secret-at-least-32-chars
          GEMINI_API_KEY: test-key
          CROFAI_API_KEY: test-key
        run: go test -race -coverprofile=coverage.out ./...

      - name: Go build
        working-directory: backend
        run: go build ./...

      - name: Migration smoke (up)
        working-directory: backend
        env:
          DATABASE_URL: postgres://mitlist:mitlist@localhost:5432/mitlist_test?sslmode=disable
        run: go run ./cmd/migrate/main.go up

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: frontend
        run: flutter pub get

      - name: Dart analyze
        working-directory: frontend
        run: dart analyze lib/

      - name: Flutter test
        working-directory: frontend
        run: flutter test

      - name: Flutter build web (release PWA)
        working-directory: frontend
        run: flutter build web --release --pwa-strategy offline-first

      - name: Upload Go coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: backend/coverage.out
