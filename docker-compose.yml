# Local dev:  docker compose up
# Production: docker compose --profile prod up -d
#
# Prod images are built by .gitea/workflows/deploy-prod.yml and pushed as:
#   ${MITLIST_IMAGE}-frontend:${MITLIST_TAG}
#   ${MITLIST_IMAGE}-backend:${MITLIST_TAG}
#
# Set MITLIST_IMAGE in .env (e.g. git.vinylnostalgia.com/you/mitlist).
# Bake PRODUCTION_API_BASE_URL into the frontend image at build time so the PWA
# can reach the API (see frontend/Dockerfile.prod).

services:
  api:
    profiles: [dev]
    build:
      context: ./backend
      dockerfile_inline: |
        FROM golang:1.25
        RUN go install github.com/air-verse/air@latest
        WORKDIR /app
        CMD ["air", "-c", ".air.toml"]
    container_name: mitlist-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
    environment:
      DATABASE_URL: postgres://mitlist:mitlist@db:5432/mitlist?sslmode=disable
      SECRET_KEY: dev-only-insecure-key-do-not-use-in-prod
      SESSION_SECRET_KEY: dev-only-insecure-session-key-not-for-prod
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:5173
      API_PREFIX: /api
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      RUN_MIGRATIONS_ON_STARTUP: "true"
      LOG_LEVEL: DEBUG
      SCRAPER_FLARESOLVER_URL: http://flaresolverr:8191
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy

  backend:
    profiles: [prod]
    image: ${MITLIST_IMAGE:-git.vinylnostalgia.com/mitlist/mitlist}-backend:${MITLIST_TAG:-latest}
    container_name: mitlist-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mitlist}?sslmode=${DB_SSLMODE:-disable}}
      ENVIRONMENT: production
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL to the public web app origin}
      RUN_MIGRATIONS_ON_STARTUP: "true"
      LOG_LEVEL: WARNING
      SCRAPER_FLARESOLVER_URL: http://flaresolverr:8191
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    profiles: [prod]
    image: ${MITLIST_IMAGE:-git.vinylnostalgia.com/mitlist/mitlist}-frontend:${MITLIST_TAG:-latest}
    container_name: mitlist-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: mitlist-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mitlist}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-mitlist}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Headless-browser proxy that solves Cloudflare/JS bot challenges. The scraper
  # falls back to it (SCRAPER_FLARESOLVER_URL) when a host blocks the direct
  # fetch — common from datacenter IPs even with a browser user-agent.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: mitlist-flaresolverr
    expose:
      - "8191"
    restart: unless-stopped

volumes:
  postgres-data:
  go-mod-cache:
