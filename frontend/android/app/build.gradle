plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.plugin.compose"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Release signing config is loaded from android/key.properties (gitignored).
// See key.properties.example for the expected keys. Falls back to debug
// signing only when the file is absent (e.g. `flutter run --release` locally).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def isReleaseBuild = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}
if (isReleaseBuild && !keystorePropertiesFile.exists()) {
    throw new GradleException("Release signing is not configured. Create android/key.properties from key.properties.example.")
}
if (isReleaseBuild && !file("google-services.json").exists()) {
    throw new GradleException("Release Firebase configuration is missing at android/app/google-services.json.")
}

android {
    namespace = "me.mitlist"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    // Home screen widgets are Jetpack Glance (Compose for RemoteViews).
    buildFeatures {
        compose = true
    }

    testOptions {
        unitTests {
            // Widget core tests read the shared fixtures in contracts/widgets.
            all {
                systemProperty "mitlist.contracts.dir", rootProject.file("../../contracts/widgets").absolutePath
            }
        }
    }

    defaultConfig {
        applicationId = "me.mitlist"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        jniLibs {
            // tflite_flutter bundles the GPU delegate .so (~3.5MB per ABI),
            // but the grocery classifier runs CPU-only (plain
            // Interpreter.fromAsset, no GpuDelegate anywhere) — the library
            // is never dlopen'd, so it is safe to strip from the APK.
            excludes += ["**/libtensorflowlite_gpu_jni.so"]
        }
    }
}

dependencies {
    // Chrome Custom Tabs: OAuth sign-in renders inside the app instead of
    // handing the user off to a separate browser app.
    implementation "androidx.browser:browser:1.8.0"

    // Home screen widgets, quick add and the widget sync worker (plans/047).
    // Glance 1.2.x is the newest stable line that builds on AGP 8.13; 1.3
    // needs AGP 9.2. WorkManager is pinned to the 2.10 line, built with an
    // older Kotlin than this project's 2.1 compiler.
    implementation "androidx.glance:glance-appwidget:1.2.0"
    implementation "androidx.work:work-runtime-ktx:2.10.5"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // org.json is stubbed in android.jar; the JVM tests need the real one.
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}

flutter {
    source = "../.."
}
