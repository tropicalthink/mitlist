plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Release signing config is loaded from android/key.properties (gitignored).
// See key.properties.example for the expected keys. Falls back to debug
// signing only when the file is absent (e.g. `flutter run --release` locally).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def isReleaseBuild = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}
if (isReleaseBuild && !keystorePropertiesFile.exists()) {
    throw new GradleException("Release signing is not configured. Create android/key.properties from key.properties.example.")
}
if (isReleaseBuild && !file("google-services.json").exists()) {
    throw new GradleException("Release Firebase configuration is missing at android/app/google-services.json.")
}

android {
    namespace = "me.mitlist"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "me.mitlist"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        jniLibs {
            // tflite_flutter bundles the GPU delegate .so (~3.5MB per ABI),
            // but the grocery classifier runs CPU-only (plain
            // Interpreter.fromAsset, no GpuDelegate anywhere) — the library
            // is never dlopen'd, so it is safe to strip from the APK.
            excludes += ["**/libtensorflowlite_gpu_jni.so"]
        }
    }
}

dependencies {
    // Chrome Custom Tabs: OAuth sign-in renders inside the app instead of
    // handing the user off to a separate browser app.
    implementation "androidx.browser:browser:1.8.0"
}

flutter {
    source = "../.."
}
