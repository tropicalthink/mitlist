name: onnxruntime
description: >-
  Mitlist's pinned FFI wrapper for the official ONNX Runtime 1.20.0 mobile
  binaries. Based on onnxruntime_flutter 1.4.1.
version: 1.4.1+ort1.20.0
publish_to: none
homepage: https://github.com/gtbluesky/onnxruntime_flutter

environment:
  sdk: '>=2.17.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  ffi: ^2.0.1
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true

